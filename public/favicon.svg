      fill="#3B4450"
    />
    <!-- Hand on table -->
    <path d="M72 68.6 C72 66.8 74 65.5 76.2 65.5 L77.8 65.5 L77.8 68.6 Z" fill="#FFFFFF" />
    <!-- White sleeve/arm accent -->
    <path
      d="M89.5 60.5 L89 66.2 C88.9 67.8 87.8 68.8 86.2 68.8 L79.5 68.8"
      stroke="#FFFFFF"
      stroke-width="1.6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <line x1="85.2" y1="60.5" x2="84.5" y2="65.5" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" />
  </g>
</svg>
