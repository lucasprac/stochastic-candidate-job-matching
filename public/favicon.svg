  </defs>

  <!-- Rounded square background -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)" />

  <!-- Table -->
  <line x1="45" y1="70" x2="83" y2="70" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" />

  <!-- Desk microphone on table -->
  <g fill="#3B4450">
    <path d="M62 68.6 C62 66.5 64 65.5 66 65.5 C68 65.5 70 66.5 70 68.6 Z" />
    <path d="M65 66 L69 57.5" stroke="#3B4450" stroke-width="2.8" stroke-linecap="round" />
    <circle cx="71.2" cy="54.8" r="3.6" fill="#4E5866" />
  </g>

  <!-- Left chair -->
  <path
    d="M27.5 57.5 L31.5 77.5 C32.3 81.5 34.5 83 38.5 83 L43.5 83 C45.8 83 47 84.5 47.8 87.5 L49.5 93.5"
    stroke="#FFFFFF"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Right chair -->
  <path
    d="M100.5 57.5 L96.5 77.5 C95.7 81.5 93.5 83 89.5 83 L84.5 83 C82.2 83 81 84.5 80.2 87.5 L78.5 93.5"
