    <!-- Hand holding microphone -->
    <path d="M56.2 60.2 C57.8 58.5 60.5 58.8 61.5 60.8 C62.2 62.2 61.2 64.2 59.5 64.5 L56.5 63.5 Z" fill="#FFFFFF" />
