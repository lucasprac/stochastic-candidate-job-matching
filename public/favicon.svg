    <!-- Head / Face (facing left) -->
    <path
      d="M86 38 C80.5 38 77.5 41 77.5 45 L75.5 47.5 L77.5 48.3 C77.6 51.5 79.5 53.5 82.8 53.5 L84.5 53.5 L84.5 55.5 L89.5 53.5 C89.5 49 89.5 41 86 38 Z"
