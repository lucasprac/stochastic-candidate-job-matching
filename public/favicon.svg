    <path d="M56.5 55.2 L61 63.2" stroke="#3B4450" stroke-width="2.8" stroke-linecap="round" />
    <circle cx="55.2" cy="52.8" r="3.4" fill="#4E5866" />
  </g>

  <!-- Right person (Candidate) -->
